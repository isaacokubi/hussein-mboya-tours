name: Production Backup Restore Drill

on:
  workflow_run:
    workflows: ["Production MongoDB Backup"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: GitHub Actions run ID containing the encrypted backup artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore:
    name: Restore encrypted backup into disposable local MongoDB
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BACKUP_RUN_ID: ${{ github.event.workflow_run.id || inputs.backup_run_id }}

    steps:
      - name: Validate successful production backup run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(printf '%s' "${BACKUP_RUN_ID:-}" | tr -d '[:space:]')"
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "A successful production backup run ID is required."
            exit 1
          fi
          run_json="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion,event)"
          echo "$run_json"
          python - <<'PY' "$run_json"
          import json
          import sys
          run = json.loads(sys.argv[1])
          if run.get("workflowName") != "Production MongoDB Backup":
              raise SystemExit(f"Run {run.get('workflowName')!r} is not the production backup workflow.")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit(f"Backup run is not a successful completed run: {run}")
          PY

      - name: Download encrypted backup artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-artifact
          gh run download "$BACKUP_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'production-mongodb-backup-*' --dir restore-artifact
          archive_count="$(find restore-artifact -name '*.archive.gz.enc' -type f | wc -l)"
          test "$archive_count" -eq 1 || { echo "Expected exactly one encrypted backup archive; found $archive_count."; exit 1; }

      - name: Validate encryption passphrase
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" || { echo "BACKUP_ENCRYPTION_PASSPHRASE is required."; exit 1; }

      - name: Decrypt archive and verify compressed payload
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          archive="$(find restore-artifact -name '*.archive.gz.enc' -type f | head -n 1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$archive" -pass env:BACKUP_ENCRYPTION_PASSPHRASE > restore.archive.gz
          test -s restore.archive.gz
          gzip -t restore.archive.gz
          checksum="$(find restore-artifact -name '*.archive.gz.enc.sha256' -type f | head -n 1)"
          expected="$(awk '{print $1}' "$checksum")"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test -n "$expected" && test "$expected" = "$actual" || { echo "Encrypted backup SHA-256 verification failed."; exit 1; }

      - name: Restore into isolated ephemeral MongoDB
        shell: bash
        run: |
          set -euo pipefail
          network="restore-drill-network"
          container="restore-drill-mongo"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d --name "$container" --network "$network" mongo:8 --bind_ip_all >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -qx '1'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Ephemeral restore MongoDB did not become ready."
            docker logs --tail 100 "$container" 2>&1 || true
            exit 1
          fi

          docker run --rm -i --network "$network" -v "$PWD/restore.archive.gz:/tmp/restore.archive.gz:ro" mongo:8 \
            mongorestore --host "$container:27017" --archive=/tmp/restore.archive.gz --gzip --drop

          docker run --rm --network "$network" mongo:8 mongosh \
            --quiet "mongodb://$container:27017/admin" --eval '
              const names = db.getMongo().getDBNames().filter((name) => !["admin", "config", "local"].includes(name));
              const appDbName = names.find((name) => {
                const candidate = db.getSiblingDB(name);
                const collections = candidate.getCollectionNames();
                return collections.includes("organizations") && collections.includes("users");
              });
              if (!appDbName) throw new Error("Restored archive is missing organizations/users collections");
              const restored = db.getSiblingDB(appDbName);
              const users = restored.users.countDocuments({});
              const organizations = restored.organizations.countDocuments({});
              if (!users || !organizations) throw new Error("Restored users and organizations must contain readable documents");
              const organizationIds = restored.organizations.find({}, { _id: 1 }).toArray().map(({ _id }) => String(_id));
              const collections = restored.getCollectionNames();
              const tenantReferenceOrphans = {};
              for (const required of ["bookings", "payments", "invoices"]) {
                if (!collections.includes(required)) throw new Error("Restored archive is missing " + required);
                const collection = restored.getCollection(required);
                const indexes = collection.getIndexes();
                if (!indexes.length) throw new Error("Restored " + required + " has no readable indexes");
                tenantReferenceOrphans[required] = collection.aggregate([
                  { $match: { tenantId: { $exists: true, $ne: null } } },
                  { $match: { $expr: { $not: { $in: [{ $toString: "$tenantId" }, organizationIds] } } } },
                  { $count: "count" }
                ]).toArray()[0]?.count || 0;
                if (tenantReferenceOrphans[required]) throw new Error("Restored " + required + " contains orphan tenant references");
              }
              printjson({
                result: "PASS",
                database: appDbName,
                users,
                organizations,
                bookings: restored.bookings.countDocuments({}),
                payments: restored.payments.countDocuments({}),
                invoices: restored.invoices.countDocuments({}),
                tenantReferenceOrphans,
                collectionCount: collections.length
              });
            '

          echo "Restore drill passed using an ephemeral MongoDB container. No production or external restore database was modified."
