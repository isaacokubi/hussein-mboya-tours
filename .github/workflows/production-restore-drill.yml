name: Production Firestore Backup Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: GitHub Actions run ID containing the encrypted Firestore backup artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore:
    name: Restore Firestore backup into isolated target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Validate backup run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$(printf '%s' "$RUN_ID_INPUT" | tr -d '[:space:]')"
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi
          run_json="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion)"
          python - <<'PY' "$run_json"
          import json, sys
          run=json.loads(sys.argv[1])
          if run.get("workflowName") != "Production Firestore Backup":
              raise SystemExit("Selected run is not the Firestore backup workflow.")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("Selected backup run did not complete successfully.")
          PY

      - name: Download backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$(printf '%s' "$RUN_ID_INPUT" | tr -d '[:space:]')"
          mkdir -p restore-artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'production-firestore-backup-*' --dir restore-artifact
          archive_count="$(find restore-artifact -name '*.json.enc' -type f | wc -l)"
          test "$archive_count" -eq 1

      - name: Validate isolated restore target
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.RESTORE_FIREBASE_PROJECT_ID }}
          PRODUCTION_FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
          RESTORE_TARGET_ISOLATED: ${{ secrets.RESTORE_TARGET_ISOLATED }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.RESTORE_FIREBASE_SERVICE_ACCOUNT_JSON }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID:-}"
          test -n "${PRODUCTION_FIREBASE_PROJECT_ID:-}"
          test "${RESTORE_TARGET_ISOLATED:-}" = "true"
          test "$FIREBASE_PROJECT_ID" != "$PRODUCTION_FIREBASE_PROJECT_ID"
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}"

      - name: Decrypt backup
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          archive="$(find restore-artifact -name '*.json.enc' -type f | head -n 1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$archive" -pass env:BACKUP_ENCRYPTION_PASSPHRASE -out restore.json

      - name: Restore and validate tenant references
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.RESTORE_FIREBASE_PROJECT_ID }}
          PRODUCTION_FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
          RESTORE_TARGET_ISOLATED: ${{ secrets.RESTORE_TARGET_ISOLATED }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.RESTORE_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node server/scripts/firestoreRestore.js restore.json
