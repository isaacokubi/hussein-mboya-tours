name: Isolated Mongoose security patch validation

on:
  push:
    branches:
      - security/mongoose-8-24-7

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: "${{ github.event.head_commit.message != 'fix(security): upgrade mongoose to 8.24.7' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install current dependencies
        run: npm ci

      - name: Apply patched Mongoose release
        run: npm install mongoose@8.24.7 --save

      - name: Confirm production dependency audit is clear
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(counts, null, 2));
          if ((counts.critical || 0) > 0 || (counts.high || 0) > 0) {
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({ package: name, severity: item.severity, range: item.range, via: item.via }));
            }
            process.exit(1);
          }
          NODE

      - name: Run static, security and production checks
        run: npm run check:all

      - name: Run backend test suite
        run: npm test

      - name: Commit validated dependency lockfile
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          git diff --cached --quiet && { echo "No dependency changes were generated."; exit 1; }
          git commit -m "fix(security): upgrade mongoose to 8.24.7"
          git push origin "HEAD:${GITHUB_REF_NAME}"
