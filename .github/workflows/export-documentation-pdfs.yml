name: Export Documentation PDFs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/export-documentation-pdfs.py"
      - ".github/workflows/export-documentation-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Build complete documentation PDF bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF generator
        run: python -m pip install --upgrade pip reportlab
      - name: Generate all documentation PDFs
        run: python scripts/export-documentation-pdfs.py
      - name: Upload downloadable PDF bundle
        uses: actions/upload-artifact@v4
        with:
          name: hussein-mboya-tours-documentation-pdfs
          path: |
            dist/hussein-mboya-tours-documentation-pdfs.zip
            dist/documentation-pdfs/*.pdf
            dist/documentation-pdfs/MANIFEST.json
            dist/documentation-pdfs/README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
