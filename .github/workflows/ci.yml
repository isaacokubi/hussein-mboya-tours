name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-checks:
    name: Server Firebase/Firestore checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: ci-test-tenant
      NODE_ENV: test
      FIREBASE_PROJECT_ID: demo-global-tours
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      GCLOUD_PROJECT: demo-global-tours
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project demo-global-tours > /tmp/firestore-emulator.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
      - name: Syntax, security, RBAC and multitenancy checks
        run: npm run check:all
      - name: Tenant isolation regression
        run: npm run check:multitenancy:live
      - name: Automated tests
        run: npm test

  client-checks:
    name: Client lint and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
