name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-checks:
    name: Server production checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: 000000000000000000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax, security, RBAC and multitenancy checks
        run: npm run check:all

      - name: Automated tests
        run: npm test

  server-live-isolation:
    name: Live tenant isolation regression
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: 000000000000000000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live tenant isolation regression
        run: npm run check:multitenancy:live

      - name: Run database-backed startup and health checks
        env:
          HEALTH_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci
        run: node --test tests/healthReadiness.test.js

  server-tour-lifecycle-integration:
    name: Tour lifecycle runtime integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci?replicaSet=rs0
      FIRST_TENANT_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/first_tenant_acceptance_ci?replicaSet=rs0
      RUN_DATABASE_INTEGRATION_TESTS: "true"
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: 000000000000000000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Mongo replica set
        working-directory: .
        run: |
          docker run -d --name mongo-tour-ci -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          until docker exec mongo-tour-ci mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; do sleep 1; done
          docker exec mongo-tour-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

      - name: Run tour lifecycle integration
        run: node --test tests/tourLifecycleIntegration.test.js tests/hospitalityPaymentLifecycleIntegration.test.js tests/firstTenantAcceptance.integration.test.js

      - name: Cleanup Mongo replica set
        if: always()
        working-directory: .
        run: docker rm -f mongo-tour-ci || true

  client-checks:
    name: Client lint and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
        run: npm run build
