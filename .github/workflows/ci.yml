name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-local-e2e:
    name: Client local browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build for local preview
        env:
          VITE_API_URL: https://mock-api.invalid/api
          VITE_SOCKET_URL: https://mock-api.invalid
        run: npm run build
      - name: Run mocked local browser smoke tests
        env:
          CI: "true"
          PLAYWRIGHT_LOCAL_PREVIEW: "true"
        run: npx playwright test e2e/local-ui.spec.js

  server-checks:
    name: Server production checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: 000000000000000000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax, security, RBAC and multitenancy checks
        run: npm run check:all

      - name: Automated tests
        run: npm test

  server-live-isolation:
    name: Live tenant isolation regression
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: 000000000000000000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live tenant isolation regression
        run: npm run check:multitenancy:live

      - name: Run database-backed startup and health checks
        run: node --test tests/healthReadiness.test.js

  server-tour-lifecycle-integration:
    name: Tour lifecycle runtime integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      LIFECYCLE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci?replicaSet=rs0
      RUN_DATABASE_INTEGRATION_TESTS: "true"
      JWT_SECRET: ci-only-test-secret
      DEFAULT_TENANT_ID: 000000000000000000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Mongo replica set
        working-directory: .
        run: |
          docker run -d --name mongo-tour-ci -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          until docker exec mongo-tour-ci mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; do sleep 1; done
          docker exec mongo-tour-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

      - name: Run tour lifecycle integration
        run: node --test tests/tourLifecycleIntegration.test.js tests/hospitalityPaymentLifecycleIntegration.test.js tests/firstTenantAcceptance.integration.test.js

      - name: Cleanup Mongo replica set
        if: always()
        working-directory: .
        run: docker rm -f mongo-tour-ci || true

  client-checks:
    name: Client lint and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inspect dependency audit advisories
        run: |
          npm audit --json > /tmp/client-audit.json || true
          node <<'NODE'
          const audit = require("/tmp/client-audit.json");
          const advisories = Object.entries(audit.vulnerabilities || {}).map(([name, vulnerability]) => ({
            name,
            severity: vulnerability.severity,
            range: vulnerability.range,
            fixAvailable: vulnerability.fixAvailable,
            via: (vulnerability.via || []).map((item) => typeof item === "string" ? item : ({
              name: item.name,
              title: item.title,
              url: item.url,
              range: item.range,
            })),
          }));
          console.log(JSON.stringify({ metadata: audit.metadata?.vulnerabilities, advisories }, null, 2));
          NODE

      - name: Generate patched client dependency lockfile
        run: |
          npm pkg delete devDependencies.depcheck devDependencies.ts-prune
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || true
          npm ci

      - name: Upload patched client dependency files
        uses: actions/upload-artifact@v4
        with:
          name: client-dependency-fix
          path: |
            client/package.json
            client/package-lock.json
          if-no-files-found: error

      - name: ESLint
        run: npm run lint

      - name: Production build
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
        run: npm run build
