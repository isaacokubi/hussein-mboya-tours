name: Dependency Remediation and Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    name: Preview non-breaking lockfile security fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply isolated npm audit remediations
        shell: bash
        run: |
          set -euo pipefail
          (cd server && npm audit fix --force --ignore-scripts || true)
          (cd client && npm audit fix --force --ignore-scripts || true)
          (cd client && npm uninstall depcheck vite-plugin-pwa workbox-build --save-dev --ignore-scripts)
          (cd client && npm audit fix --ignore-scripts || true)
      - name: Generate post-remediation audit reports
        shell: bash
        run: |
          set +e
          (cd server && npm audit --json) > server-npm-audit-after.json
          server_status=$?
          (cd client && npm audit --json) > client-npm-audit-after.json
          client_status=$?
          set -e
          echo "Server audit exit code: $server_status"
          echo "Client audit exit code: $client_status"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const file of ["server-npm-audit-after.json", "client-npm-audit-after.json"]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const vulnerabilities = report.metadata?.vulnerabilities || {};
            console.log(JSON.stringify({file, vulnerabilities, affected: Object.keys(report.vulnerabilities || {})}, null, 2));
            if (Number(vulnerabilities.total || 0) > 0) {
              process.exitCode = 1;
            }
          }
          NODE
      - name: Validate remediated server and client dependency trees
        shell: bash
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/hussein_mboya_ci
          JWT_SECRET: ci-only-test-secret
          DEFAULT_TENANT_ID: 000000000000000000000000
          NODE_ENV: test
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "YAML syntax OK: #{file}" }' \
            .github/workflows/production-backup.yml .github/workflows/production-restore-drill.yml .github/workflows/explicit-production-demo-matrix.yml
          (
            cd server
            npm ci
            npm run check:all
            npm test
          )
          (
            cd client
            npm ci
            npm run lint
            npm run build
          )
      - name: Commit audited dependency manifests and lockfiles to the PR branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json client/package.json client/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests and lockfiles already match the validated audit remediation."
          else
            git diff --cached --check
            git commit -m "fix(deps): resolve audited dependency vulnerabilities"
            git fetch origin "${GITHUB_HEAD_REF}"
            git rebase FETCH_HEAD
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload lockfile remediation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview-${{ github.run_id }}
          path: |
            server/package.json
            server/package-lock.json
            client/package.json
            client/package-lock.json
            server-npm-audit-after.json
            client-npm-audit-after.json
          if-no-files-found: error
          retention-days: 14
