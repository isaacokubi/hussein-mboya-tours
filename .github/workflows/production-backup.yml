name: Production Firestore Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted Firestore backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Validate backup secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.PRODUCTION_FIREBASE_SERVICE_ACCOUNT_JSON }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID:-}" || { echo "PRODUCTION_FIREBASE_PROJECT_ID is required."; exit 1; }
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo "PRODUCTION_FIREBASE_SERVICE_ACCOUNT_JSON is required."; exit 1; }
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" || { echo "BACKUP_ENCRYPTION_PASSPHRASE is required."; exit 1; }

      - name: Export Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.PRODUCTION_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p backup
          node server/scripts/firestoreBackup.js backup/firestore.json

      - name: Create encrypted backup archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="backup/global-tours-firestore-${stamp}.json.enc"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in backup/firestore.json -out "$archive"
          sha256sum "$archive" > "$archive.sha256"
          rm -f backup/firestore.json
          printf '%s\n' "$archive" > backup/latest.txt

      - name: Verify encrypted backup
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          archive="$(cat backup/latest.txt)"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$archive" -pass env:BACKUP_ENCRYPTION_PASSPHRASE | node -e '
            let data="";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              const payload = JSON.parse(data);
              if (payload.format !== "global-tours-firestore-backup-v1") process.exit(1);
              if (!Number.isInteger(payload.documentCount) || payload.documentCount < 1) process.exit(1);
              console.log(JSON.stringify({ projectId: payload.projectId, documentCount: payload.documentCount, checksum: payload.checksum }));
            });
          '

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-firestore-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 30
