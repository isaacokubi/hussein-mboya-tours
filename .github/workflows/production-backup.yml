name: Production MongoDB Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted MongoDB backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate backup secrets
        env:
          MONGODB_BACKUP_URI: ${{ secrets.MONGODB_BACKUP_URI }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${MONGODB_BACKUP_URI:-}" || { echo "MONGODB_BACKUP_URI is required."; exit 1; }
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" || { echo "BACKUP_ENCRYPTION_PASSPHRASE is required."; exit 1; }

      - name: Create encrypted database archive
        env:
          MONGODB_BACKUP_URI: ${{ secrets.MONGODB_BACKUP_URI }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="backup/global-tours-${stamp}.archive.gz.enc"
          docker run --rm \
            -e MONGODB_BACKUP_URI="$MONGODB_BACKUP_URI" \
            mongo:8 \
            sh -lc 'mongodump --uri="$MONGODB_BACKUP_URI" --archive --gzip' \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          printf '%s\n' "$archive" > backup/latest.txt

      - name: Verify archive contains application data
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          archive="$(cat backup/latest.txt)"
          decrypted_archive="/tmp/production.archive.gz"
          network="backup-validation-network"
          container="backup-validation-mongo"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f "$decrypted_archive"
          }
          trap cleanup EXIT

          openssl enc -d -aes-256-cbc -pbkdf2 -in "$archive" -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            > "$decrypted_archive"
          gzip -t "$decrypted_archive"

          docker network create "$network" >/dev/null
          docker run -d --name "$container" --network "$network" mongo:8 --bind_ip_all >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -qx '1'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Temporary MongoDB validation server did not become ready."
            docker inspect "$container" --format 'Container state: {{json .State}}' 2>/dev/null || true
            docker logs --tail 100 "$container" 2>&1 || true
            exit 1
          fi

          sha256sum -c "$archive.sha256"
          docker run --rm -i --network "$network" mongo:8 \
            mongorestore --host "$container:27017" --archive --gzip \
            < "$decrypted_archive"

          docker run --rm --network "$network" mongo:8 mongosh \
            --quiet "mongodb://$container:27017/admin" --eval '
              const names = db.getMongo().getDBNames().filter((name) => !["admin", "config", "local"].includes(name));
              const appDbName = names.find((name) => {
                const candidate = db.getSiblingDB(name);
                const collections = candidate.getCollectionNames();
                return collections.includes("organizations") && collections.includes("users");
              });
              if (!appDbName) throw new Error("Restored archive is missing organizations/users collections");
              const restored = db.getSiblingDB(appDbName);
              const users = restored.users.countDocuments({});
              const organizations = restored.organizations.countDocuments({});
              if (!users || !organizations) throw new Error("Restored users and organizations must contain readable documents");
              const organizationIds = restored.organizations.find({}, { _id: 1 }).toArray().map(({ _id }) => _id);
              const collections = restored.getCollectionNames();
              const integrity = {};
              for (const required of ["bookings", "payments", "invoices"]) {
                if (!collections.includes(required)) throw new Error(`Restored archive is missing ${required}`);
                const indexes = restored.getCollection(required).getIndexes();
                if (!indexes.length) throw new Error(`Restored ${required} collection has no readable indexes`);
                integrity[required] = restored.getCollection(required).countDocuments({
                  tenantId: { $exists: true, $ne: null, $nin: organizationIds }
                });
                if (integrity[required]) throw new Error(`Restored ${required} contain tenant references without an organization`);
              }
              printjson({ database: appDbName, userCount: users, organizationCount: organizations,
                bookings: restored.bookings.countDocuments({}), payments: restored.payments.countDocuments({}),
                invoices: restored.invoices.countDocuments({}), tenantReferenceOrphans: integrity,
                collectionCount: collections.length });
            '

          echo "Encrypted archive decrypted, restored into isolated MongoDB, and application data validated."

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-mongodb-backup-${{ github.run_id }}
          path: |
            backup/*.archive.gz.enc
            backup/*.archive.gz.enc.sha256
          if-no-files-found: error
          retention-days: 30
