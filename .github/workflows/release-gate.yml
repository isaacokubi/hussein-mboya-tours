name: Eighteen-Phase Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-1-security:
    name: Phase 1 — Security and tenant integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      FIREBASE_PROJECT_ID: demo-global-tours
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      GCLOUD_PROJECT: demo-global-tours
      JWT_SECRET: ci-only-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project demo-global-tours > /tmp/firestore-emulator.log 2>&1 &
          sleep 10
      - name: Syntax, model, service and production checks
        run: npm run check:all
      - name: Full backend test suite
        run: npm test
      - name: Tour domain regression suite
        run: npm run test:tour-domain

  phase-2-kenya-readiness:
    name: Phase 2 — Kenya production readiness
    runs-on: ubuntu-latest
    needs: phase-1-security
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production readiness contract
        run: npm run check:production
      - name: Kenya production-readiness contracts
        run: node --test tests/kenyaProductionReadiness.test.js
      - name: Verify Kenya compliance and payment modules exist
        run: |
          test -f models/EtimsCredential.js
          test -f models/EtimsSubmission.js
          test -f models/TaxProfile.js
          test -f models/TaxRule.js
          test -f models/WithholdingTax.js
          test -f services/etimsService.js
          test -f services/taxEngineService.js
          test -f services/operationalAccountingService.js
          test -f services/financeLifecycleService.js
          test -f services/mpesaService.js
          test -f services/paymentLifecycleService.js
          test -f services/webhookDeliveryService.js
          test -f controllers/complianceController.js
          test -f controllers/privacyController.js
          test -f controllers/financeComplianceController.js
          test -f controllers/expenseLifecycleController.js
          test -f controllers/withholdingTaxController.js
          test -f models/CreditDebitNote.js
          test -f models/PurchaseOrder.js
          test -f models/SupplierPayable.js
          test -f models/TourCost.js
          test -f models/CorporateAccount.js
          test -f models/ChartOfAccount.js
          test -f models/JournalEntry.js

  phase-4-deployment-infrastructure:
    name: Phase 4 — Deployment & infrastructure acceptance contract
    runs-on: ubuntu-latest
    needs: phase-3-release
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm install
      - name: Deployment infrastructure contract
        run: node --test tests/deploymentInfrastructureAcceptance.test.js

  phase-3-release:
    name: Phase 3 — Final release gate
    runs-on: ubuntu-latest
    needs: phase-2-kenya-readiness
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record current release commit
        run: |
          test -f README.md
          test -f docs/PRODUCTION_READINESS.md
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          echo "Release candidate commit: ${CURRENT_COMMIT}"
          echo "RELEASE_COMMIT=${CURRENT_COMMIT}" >> "$GITHUB_ENV"
      - name: Verify current release commit is recorded
        run: test -n "${RELEASE_COMMIT}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Final release contract
        working-directory: server
        run: node --test tests/finalReleaseGateContract.test.js
      - name: Install client dependencies
        working-directory: client
        run: npm install
      - name: Client lint
        working-directory: client
        run: npm run lint
      - name: Client production build
        working-directory: client
        run: npm run build
      - name: Verify release configuration files
        run: |
          test -f vercel.json
          test -f client/.env.example
          test -f server/.env.example
          test -f docs/EXTERNAL_WEBSITE_CONNECTOR.md
          test -f docs/COMMERCIAL_READINESS_IMPLEMENTATION_STATUS.md
      - name: Verify no committed environment secrets
        run: |
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude='*.lock' \
            -E '(sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            client server


