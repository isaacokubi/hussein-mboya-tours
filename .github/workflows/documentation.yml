name: Documentation synchronization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-sync-main
  cancel-in-progress: false

jobs:
  snapshot:
    name: Generate repository documentation snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh generated documentation state
        run: node scripts/update-documentation.js

      - name: Upload generated documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: repository-documentation-snapshot
          path: |
            README.md
            docs/PRODUCTION_READINESS.md
            docs/TEST_EVIDENCE.md
