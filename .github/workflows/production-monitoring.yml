name: Production Monitoring

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Simulate a monitoring failure to verify alert delivery without touching production
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitoring
  cancel-in-progress: true

env:
  PRODUCTION_API_URL: https://hussein-mboya-tours.onrender.com
  PRODUCTION_WEB_URL: https://hussein-mboya-tours.vercel.app

jobs:
  monitor:
    name: Production uptime, latency and alert monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check production API health and latency
        id: api
        shell: bash
        run: |
          started="$(date +%s%3N)"
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H 'Accept: application/json' \
            "$PRODUCTION_API_URL/api/health")"
          ended="$(date +%s%3N)"
          latency_ms="$((ended - started))"

          echo "$response"
          echo "latency_ms=$latency_ms" >> "$GITHUB_OUTPUT"

          RESPONSE="$response" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["RESPONSE"])

          if payload.get("success") is not True:
              raise SystemExit(f"Production API health success flag is not true: {payload}")

          if payload.get("status") != "healthy":
              raise SystemExit(f"Production API is not healthy: {payload}")

          if payload.get("database") != "connected":
              raise SystemExit(f"Production database is not connected: {payload}")
          PY

      - name: Check production website and latency
        id: web
        shell: bash
        run: |
          started="$(date +%s%3N)"

          curl --fail-with-body --silent --show-error --max-time 20 \
            -I "$PRODUCTION_WEB_URL/" \
            > /tmp/production-web-headers.txt

          ended="$(date +%s%3N)"
          latency_ms="$((ended - started))"

          cat /tmp/production-web-headers.txt
          echo "latency_ms=$latency_ms" >> "$GITHUB_OUTPUT"

      - name: Verify alert path
        if: ${{ inputs.simulate_failure == true }}
        shell: bash
        run: |
          echo "Simulated monitoring failure requested."
          echo "Production was NOT modified."
          exit 1

      - name: Create production monitoring alert
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          API_LATENCY_MS: ${{ steps.api.outputs.latency_ms }}
          WEB_LATENCY_MS: ${{ steps.web.outputs.latency_ms }}
        with:
          script: |
            const title = 'Production monitoring alert';

            const body = [
              'Production monitoring detected a failed health, website, latency, or alert-path check.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `API latency: ${process.env.API_LATENCY_MS || 'unavailable'} ms`,
              `Website latency: ${process.env.WEB_LATENCY_MS || 'unavailable'} ms`,
              `Commit: ${context.sha}`,
              '',
              'Investigate the failed monitoring run before treating production as healthy.'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });

            const openAlert = existing.data.find(
              issue => issue.title === title
            );

            if (!openAlert) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Publish monitoring result
        if: ${{ success() }}
        run: |
          echo "Production monitoring PASS"
          echo "API latency: ${{ steps.api.outputs.latency_ms }} ms"
          echo "Website latency: ${{ steps.web.outputs.latency_ms }} ms"
