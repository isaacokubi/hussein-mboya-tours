name: Production Monitoring

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Simulate a monitoring failure to verify alert delivery without touching production
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitoring
  cancel-in-progress: true


jobs:
  monitor:
    name: Production uptime, latency and alert monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      PRODUCTION_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production endpoint configuration
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_API_URL:-}" || { echo "PRODUCTION_API_URL is required."; exit 1; }
          test -n "${PRODUCTION_WEB_URL:-}" || { echo "PRODUCTION_WEB_URL is required."; exit 1; }
          case "$PRODUCTION_API_URL" in https://*) ;; *) echo "PRODUCTION_API_URL must use HTTPS."; exit 1;; esac
          case "$PRODUCTION_WEB_URL" in https://*) ;; *) echo "PRODUCTION_WEB_URL must use HTTPS."; exit 1;; esac

      - name: Check production API health and readiness
        id: api
        shell: bash
        run: |
          started="$(date +%s%3N)"
          bash scripts/check-production-api-health.sh
          ended="$(date +%s%3N)"
          readiness_wait_ms="$((ended - started))"
          echo "readiness_wait_ms=$readiness_wait_ms" >> "$GITHUB_OUTPUT"

      - name: Check production website and latency
        id: web
        shell: bash
        run: |
          started="$(date +%s%3N)"

          curl --fail-with-body --silent --max-time 20 \
            -I "$PRODUCTION_WEB_URL/" \
            2>/dev/null \
            > /tmp/production-web-headers.txt

          ended="$(date +%s%3N)"
          latency_ms="$((ended - started))"

          cat /tmp/production-web-headers.txt
          echo "latency_ms=$latency_ms" >> "$GITHUB_OUTPUT"

      - name: Verify alert path
        if: ${{ inputs.simulate_failure == true }}
        shell: bash
        run: |
          echo "Simulated monitoring failure requested."
          echo "Production was NOT modified."
          exit 1

      - name: Create production monitoring alert
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          PRODUCTION_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
          API_READINESS_WAIT_MS: ${{ steps.api.outputs.readiness_wait_ms }}
          WEB_LATENCY_MS: ${{ steps.web.outputs.latency_ms }}
        with:
          script: |
            const title = 'Production monitoring alert';

            const body = [
              'Production monitoring detected a failed health, website, latency, or alert-path check.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `API readiness wait: ${process.env.API_READINESS_WAIT_MS || 'unavailable'} ms`,
              `Website latency: ${process.env.WEB_LATENCY_MS || 'unavailable'} ms`,
              `Commit: ${context.sha}`,
              '',
              'Investigate the failed monitoring run before treating production as healthy.'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });

            const openAlert = existing.data.find(
              issue => issue.title === title
            );

            if (!openAlert) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Publish monitoring result
        if: ${{ success() }}
        run: |
          echo "Production monitoring PASS"
          echo "API readiness wait: ${{ steps.api.outputs.readiness_wait_ms }} ms"
          echo "Website latency: ${{ steps.web.outputs.latency_ms }} ms"
