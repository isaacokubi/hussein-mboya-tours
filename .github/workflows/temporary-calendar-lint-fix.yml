name: Temporary calendar lint repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'production readiness') || contains(github.event.head_commit.message, 'lint repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair React purity lint error
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/tourManager/TourManagerCalendar.jsx')
          s = p.read_text()
          old = 'id: `${Date.now()}`,'
          new = 'id: `${dateKey(selectedDay)}-${title.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-")}`,'
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/tourManager/TourManagerCalendar.jsx
          git commit -m 'fix: resolve calendar lint purity error'
          git push
