name: Temporary inline source commenting pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/comment-source.yml"

permissions:
  contents: write

concurrency:
  group: inline-source-commenting
  cancel-in-progress: false

jobs:
  comment-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install a temporary JavaScript parser outside the repository
        run: npm install --prefix /tmp/comment-deps --no-audit --no-fund typescript@5.9.3

      - name: Add explanatory comments directly to existing source files
        id: comment
        env:
          TYPESCRIPT_PATH: /tmp/comment-deps/node_modules/typescript
        run: |
          cat > /tmp/comment-source.cjs <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const ts = require(process.env.TYPESCRIPT_PATH);

          const root = process.cwd();
          const roots = ["client", "server"];
          const codeExtensions = new Set([".js", ".jsx", ".mjs", ".cjs"]);
          const files = [];

          function collect(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (["node_modules", "dist", "build", "coverage", ".git"].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) collect(full);
              else {
                const ext = path.extname(entry.name).toLowerCase();
                if (codeExtensions.has(ext) || ext === ".css" || ext === ".html" ||
                    entry.name === ".env.example") files.push(full);
              }
            }
          }
          for (const dir of roots) if (fs.existsSync(path.join(root, dir))) collect(path.join(root, dir));

          function words(value) {
            return value.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
          }

          function expressionHint(node, source) {
            if (!node) return "the result";
            if (ts.isCallExpression(node)) return `the result of ${node.expression.getText(source)}()`;
            if (ts.isNewExpression(node)) return `a new ${node.expression.getText(source)} instance`;
            if (ts.isAwaitExpression(node)) return `the completed ${expressionHint(node.expression, source)} operation`;
            if (ts.isObjectLiteralExpression(node)) return "the object assembled below";
            if (ts.isArrayLiteralExpression(node)) return "the collection assembled below";
            if (ts.isIdentifier(node)) return `the value of ${node.text}`;
            if (ts.isPropertyAccessExpression(node)) return `the ${words(node.name.text)} value`;
            if (ts.isStringLiteral(node) || ts.isNoSubstitutionTemplateLiteral(node)) return "a configured text value";
            if (ts.isNumericLiteral(node)) return "a numeric value";
            return "the expression shown below";
          }

          function describe(node, source) {
            if (ts.isImportDeclaration(node)) return `Load ${node.moduleSpecifier.text} so this module can use its exported dependencies.`;
            if (ts.isExportDeclaration(node)) return "Expose the selected declarations or re-exported members to other parts of the application.";
            if (ts.isFunctionDeclaration(node)) return `Define ${node.name?.text || "this function"}; its parameters and body implement this operation.`;
            if (ts.isClassDeclaration(node)) return `Define ${node.name?.text || "this class"} and group related state and behavior in one reusable type.`;
            if (ts.isVariableStatement(node)) {
              const names = node.declarationList.declarations.map(item => item.name.getText(source).replace(/\s+/g, " ")).join(", ");
              return `Declare ${names || "the values below"} for use by the surrounding module or function.`;
            }
            if (ts.isReturnStatement(node)) return `Return ${expressionHint(node.expression, source)} to the caller.`;
            if (ts.isIfStatement(node)) return `Check the condition (${node.expression.getText(source).replace(/\s+/g, " ").slice(0, 70)}) and run the matching branch.`;
            if (ts.isSwitchStatement(node)) return `Select the appropriate branch based on ${node.expression.getText(source).replace(/\s+/g, " ").slice(0, 60)}.`;
            if (ts.isForStatement(node) || ts.isForOfStatement(node) || ts.isForInStatement(node) || ts.isWhileStatement(node) || ts.isDoStatement(node)) return "Repeat the enclosed work for each required iteration.";
            if (ts.isTryStatement(node)) return "Run this operation with a dedicated error-handling path for failures.";
            if (ts.isCatchClause(node)) return "Handle the error raised by the preceding protected operation.";
            if (ts.isThrowStatement(node)) return `Stop the current operation by raising ${expressionHint(node.expression, source)}.`;
            if (ts.isMethodDeclaration(node)) return `Implement the ${node.name.getText(source).replace(/\s+/g, " ")} method for this class.`;
            if (ts.isConstructorDeclaration(node)) return "Initialize a new instance and assign its required starting state.";
            if (ts.isPropertyDeclaration(node)) return `Declare the ${node.name.getText(source).replace(/\s+/g, " ")} property and its initial or type information.`;
            if (ts.isInterfaceDeclaration(node)) return `Describe the ${node.name.text} data shape expected by consuming code.`;
            if (ts.isTypeAliasDeclaration(node)) return `Define the ${node.name.text} type alias to make the value structure explicit.`;
            if (ts.isEnumDeclaration(node)) return `Define the ${node.name.text} set of named constant values.`;
            if (ts.isBreakStatement(node)) return "Exit the current loop or switch branch.";
            if (ts.isContinueStatement(node)) return "Skip the remainder of this iteration and continue with the next one.";
            if (ts.isDebuggerStatement(node)) return "Development debugging breakpoint.";
            if (ts.isExpressionStatement(node)) return "Perform the side effect or state update expressed on the following line.";
            return null;
          }

          function insideJsx(node) {
            for (let parent = node.parent; parent; parent = parent.parent) {
              if (ts.isJsxElement(parent) || ts.isJsxFragment(parent) || ts.isJsxExpression(parent)) return true;
            }
            return false;
          }

          function moduleSummary(relative, source) {
            const parts = relative.split("/");
            const base = path.basename(relative, path.extname(relative));
            const area = parts.includes("controllers") ? "HTTP controller" :
              parts.includes("routes") ? "API route module" :
              parts.includes("models") ? "database model" :
              parts.includes("middleware") ? "request middleware" :
              parts.includes("services") ? "business-logic service" :
              parts.includes("tests") || parts.includes("e2e") ? "automated test" :
              parts.includes("pages") ? "page-level UI component" :
              parts.includes("components") ? "reusable UI component" :
              parts.includes("context") ? "React context/provider" :
              parts.includes("hooks") ? "reusable React hook" :
              parts.includes("config") ? "configuration module" :
              parts.includes("scripts") ? "operational script" :
              parts.includes("seeds") ? "database seed module" :
              parts.includes("socket") ? "real-time socket module" :
              parts.includes("tenancy") ? "tenant-isolation module" :
              parts[0] === "client" ? "client application module" : "server application module";
            const declarations = [];
            function visit(node) {
              if ((ts.isFunctionDeclaration(node) || ts.isClassDeclaration(node) ||
                   ts.isInterfaceDeclaration(node) || ts.isTypeAliasDeclaration(node)) && node.name) declarations.push(node.name.text);
              if (ts.isVariableStatement(node)) {
                for (const item of node.declarationList.declarations) {
                  if (ts.isIdentifier(item.name) && item.initializer &&
                      (ts.isArrowFunction(item.initializer) || ts.isFunctionExpression(item.initializer))) declarations.push(item.name.text);
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            const names = [...new Set(declarations)].slice(0, 5);
            return `Purpose: ${words(base)} ${area}. ${names.length ? `Main declarations: ${names.join(", ")}.` : "The statements below implement this module responsibilities."}`;
          }

          function commentJavaScript(file) {
            const original = fs.readFileSync(file, "utf8");
            if (!original.trim() || original.length > 300000) return false;
            const ext = path.extname(file).toLowerCase();
            const kind = ext === ".jsx" ? ts.ScriptKind.JSX : ts.ScriptKind.JS;
            const source = ts.createSourceFile(file, original, ts.ScriptTarget.Latest, true, kind);
            const relative = path.relative(root, file).split(path.sep).join("/");
            const headerPosition = original.startsWith("#!") ? original.indexOf("\n") + 1 : 0;
            const inserts = [{ position: headerPosition, text: `/**\n * ${moduleSummary(relative, source)}\n * Inline comments explain the purpose of important declarations and executable blocks.\n */\n` }];
            const seen = new Set();

            function visit(node) {
              const raw = describe(node, source);
              const description = raw && raw.replaceAll("\n", " ").replaceAll("\r", " ");
              if (description && !insideJsx(node)) {
                const position = node.getStart(source);
                const lineStart = original.lastIndexOf("\n", position - 1) + 1;
                const prefix = original.slice(lineStart, position);
                if (/^\s*$/.test(prefix) && !seen.has(lineStart) && lineStart !== headerPosition) {
                  seen.add(lineStart);
                  inserts.push({ position: lineStart, text: `${prefix}// ${description}\n` });
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            inserts.sort((a, b) => b.position - a.position);
            let updated = original;
            for (const item of inserts) updated = updated.slice(0, item.position) + item.text + updated.slice(item.position);

            const after = ts.createSourceFile(file, updated, ts.ScriptTarget.Latest, true, kind);
            if (source.parseDiagnostics.length || after.parseDiagnostics.length) {
              throw new Error(`JavaScript syntax validation failed: ${relative}`);
            }
            const printer = ts.createPrinter({ removeComments: true });
            if (printer.printFile(source) !== printer.printFile(after)) {
              throw new Error(`Non-comment code changed while annotating: ${relative}`);
            }
            if (updated !== original) fs.writeFileSync(file, updated, "utf8");
            return updated !== original;
          }

          function commentCss(file) {
            const original = fs.readFileSync(file, "utf8");
            if (original.includes("Purpose:")) return false;
            const relative = path.relative(root, file).split(path.sep).join("/");
            const base = path.basename(file, ".css").replace(/[-_]/g, " ");
            const out = [`/* Purpose: Styles for the ${base} interface. Rule comments explain selectors and property groups. */`];
            for (const line of original.split(/\r?\n/)) {
              const trimmed = line.trim();
              const indent = line.match(/^\s*/)[0];
              if (!trimmed) { out.push(line); continue; }
              if (trimmed.includes("{") && !/^[\w-]+\s*:/.test(trimmed) && !trimmed.startsWith("/*")) {
                const selector = trimmed.split("{", 1)[0].trim();
                if (selector) out.push(`${indent}/* Apply the following styles to ${selector.slice(0, 100)}. */`);
              } else {
                const match = trimmed.match(/^([\w-]+)\s*:/);
                if (match) out.push(`${indent}/* Configure ${match[1].replace(/-/g, " ")} for this selector. */`);
              }
              out.push(line);
            }
            fs.writeFileSync(file, out.join("\n") + "\n", "utf8");
            return true;
          }

          function commentHtml(file) {
            const original = fs.readFileSync(file, "utf8");
            if (original.includes("Purpose:")) return false;
            const updated = `<!-- Purpose: Browser entry document that loads the React application and its mount point. -->\n` +
              original.replace("  <head>", "  <!-- Metadata configures the browser title, responsive viewport, and document resources. -->\n  <head>")
                .replace("  <body>", "  <!-- The body contains the DOM mount point used by React. -->\n  <body>")
                .replace('    <div id="root"></div>', '    <!-- React renders the single-page application inside this element. -->\n    <div id="root"></div>')
                .replace('    <script type="module" src="/src/main.jsx"></script>', '    <!-- Load the module that initializes React providers and application routing. -->\n    <script type="module" src="/src/main.jsx"></script>');
            fs.writeFileSync(file, updated, "utf8");
            return true;
          }

          function commentEnv(file) {
            const original = fs.readFileSync(file, "utf8");
            const out = ["# Purpose: Example environment settings; descriptions explain each configurable deployment value."];
            for (const line of original.split(/\r?\n/)) {
              const match = line.match(/^([A-Z][A-Z0-9_]*)=/);
              if (match) out.push(`# Configure ${match[1].replace(/_/g, " ").toLowerCase()} for this environment.`);
              out.push(line);
            }
            fs.writeFileSync(file, out.join("\n") + "\n", "utf8");
            return true;
          }

          let changed = 0;
          for (const file of files) {
            const ext = path.extname(file).toLowerCase();
            if (codeExtensions.has(ext)) { if (commentJavaScript(file)) changed++; }
            else if (ext === ".css") { if (commentCss(file)) changed++; }
            else if (ext === ".html") { if (commentHtml(file)) changed++; }
            else if (path.basename(file) === ".env.example") { if (commentEnv(file)) changed++; }
          }
          console.log(`Commented ${changed} existing source/configuration files; validated JavaScript/JSX syntax and comment-only AST equivalence.`);
          NODE
          node /tmp/comment-source.cjs

      - name: Verify client production build
        continue-on-error: true
        run: |
          npm ci --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Verify server JavaScript syntax
        continue-on-error: true
        run: |
          npm run check --prefix server
          npm run check:controllers --prefix server
          npm run check:models --prefix server
          npm run check:services --prefix server
          npm run check:seeds --prefix server
          npm run check:security --prefix server
          npm run check:tenant-models --prefix server

      - name: Commit the inline comments and remove the temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/comment-source.yml || true
          git add client server
          if git diff --cached --quiet; then
            echo "No source changes were staged."
          else
            git commit -m "docs: add inline comments across client and server"
            git push origin HEAD:main
          fi
